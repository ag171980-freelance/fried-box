# El front en Netlify; la API en el Apache aparte.
#
# Netlify hace de proxy para /api y /uploads: el navegador sólo ve el
# dominio de Netlify, así que no hace falta CORS y las fotos que sube el
# panel se piden igual que en desarrollo con Vite.
#
# Reemplazar API_HOST por el dominio del Apache (con https), apuntando a
# la carpeta que sirve backend/public/.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_BASE = "/"
  VITE_API_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://API_HOST/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://API_HOST/uploads/:splat"
  status = 200
  force = true

# BrowserRouter: cualquier otra ruta la resuelve React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
