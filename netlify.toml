# El front en Netlify; la API en el Apache aparte.
#
# Netlify hace de proxy para /api y /uploads: el navegador sólo ve el
# dominio de Netlify, así que no hace falta CORS y las fotos que sube el
# panel se piden igual que en desarrollo con Vite.
#
# La API vive en https://colibripremium.store/appi/public (la carpeta
# backend/ subida a /appi; sólo public/ se sirve por web).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_BASE = "/"
  VITE_API_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://colibripremium.store/appi/public/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://colibripremium.store/appi/public/uploads/:splat"
  status = 200
  force = true

# BrowserRouter: cualquier otra ruta la resuelve React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
