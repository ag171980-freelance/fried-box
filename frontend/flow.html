<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <title>Foodix · recorrido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px;
        background: #14161c;
        color: #f2eee6;
        font-family: 'Instrument Sans', system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 24px;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        font-size: 1.75rem;
        letter-spacing: -0.04em;
      }
      .rack { display: flex; gap: 24px; overflow-x: auto; }
      figure { margin: 0; flex: 0 0 auto; }
      figcaption {
        margin-bottom: 10px;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .phone {
        width: 390px;
        height: 800px;
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid #2a2f3b;
        background: #fff;
      }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <h1>Del plato al pago</h1>
    <div class="rack" id="rack"></div>
    <script>
      const params = new URLSearchParams(location.search)
      
      const STEPS = [
        ['Carta', '/?paleta=' + (params.get('paleta') || 'fuego')],
        ['Pedido', '/seed.html?to=/pedido'],
        ['Datos y pago', '/seed.html?to=/checkout'],
      ]
      const rack = document.getElementById('rack')
      for (const [name, src] of STEPS) {
        const fig = document.createElement('figure')
        fig.innerHTML =
          '<figcaption>' + name + '</figcaption><div class="phone"><iframe src="' + src + '"></iframe></div>'
        rack.appendChild(fig)
      }
    </script>
  </body>
</html>
